[tool.setuptools]
packages = ["funalyzer"]

[project]
name = "funalyzer"
version = "0.0.1"
description = "A Binary Ninja plugin for known function detection"
readme = "README.md"
authors = [
    {name = "A5t4t1ne"},
]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["Binary", "Ninja", "plugin", "LibMatch", "python"]
dependencies = [
	# "google-genai", 
	"google-generativeai",
	"python-dotenv==1.1.0", 
	"mcp==1.8.0"
]
requires-python = ">=3.12"


[project.optional-dependencies]
dev = [
    "ruff==0.11.0",
	"pyright==1.1.396",
	"pytest==8.3.5",
	"pytest-dependency==0.6.0",
	"Sphinx==8.2.3"
]

[project.urls]
Repository = "https://github.com/A5t4t1ne/funalyzer"

[tool.pyright]
exclude = ["**/__pycache__", "**/.venv", ".git", "build", "**/binaryninja*"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
